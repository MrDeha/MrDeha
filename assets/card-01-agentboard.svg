<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 245" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="topAccent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7"/>
      <stop offset="100%" stop-color="#ff2cdb" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse { animation: blink 2.2s infinite; }
  </style>

  <rect width="588" height="245" rx="6" fill="url(#cBg1)" stroke="#00fff7" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="1" y="1" width="586" height="3" rx="2" fill="url(#topAccent1)"/>

  <!-- Header Row -->
  <rect x="24" y="22" width="112" height="20" rx="3" fill="#ff2cdb" fill-opacity="0.08" stroke="#ff2cdb" stroke-opacity="0.3"/>
  <text x="80" y="35.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#ff2cdb" letter-spacing="1.5">ARCHIVE::01</text>

  <circle cx="448" cy="32" r="3.5" fill="#00fff7" class="pulse"/>
  <text x="458" y="35.5" class="mono" font-size="9.5" font-weight="600" fill="#00fff7" letter-spacing="1">CORE // DESKTOP</text>

  <!-- Title & Description -->
  <text x="24" y="70" class="sans" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">AgentBoard</text>
  <text x="166" y="69" class="mono" font-size="10.5" fill="#00fff7">// AI Agent Command Center</text>

  <text x="24" y="95" class="sans" font-size="12.5" fill="#9ca3af">
    Native multi-agent orchestration workspace &amp; Kanban command center with
  </text>
  <text x="24" y="113" class="sans" font-size="12.5" fill="#9ca3af">
    deep Model Context Protocol (MCP) integration and real-time Git telemetry.
  </text>

  <!-- Intelligence Report Box (From deha.sys Projects.tsx) -->
  <rect x="24" y="128" width="540" height="62" rx="4" fill="#0d0f17" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="36" y="146" class="mono" font-size="9.5" font-weight="700" fill="#00fff7">[INTELLIGENCE REPORT: AGENTBOARD]</text>
  <text x="36" y="163" class="mono" font-size="9.5" fill="#9ca3af">
    <tspan fill="#ff2cdb">&gt;</tspan> ARCH: Native Rust + Tauri backend with 30+ MCP task/board tools.
  </text>
  <text x="36" y="179" class="mono" font-size="9.5" fill="#9ca3af">
    <tspan fill="#ff2cdb">&gt;</tspan> CORE: Autonomous task claiming, subtask trees &amp; live commit tracking.
  </text>

  <!-- Tech Stack Pills -->
  <g class="mono" font-size="9.5" fill="#d1d5db">
    <rect x="24" y="204" width="62" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#00fff7" stroke-opacity="0.25"/>
    <text x="55" y="218.5" text-anchor="middle" fill="#00fff7">Tauri</text>

    <rect x="94" y="204" width="58" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="123" y="218.5" text-anchor="middle">Rust</text>

    <rect x="160" y="204" width="86" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="203" y="218.5" text-anchor="middle">TypeScript</text>

    <rect x="254" y="204" width="64" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="286" y="218.5" text-anchor="middle">React</text>

    <rect x="326" y="204" width="92" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ff2cdb" stroke-opacity="0.25"/>
    <text x="372" y="218.5" text-anchor="middle" fill="#ff2cdb">MCP Server</text>
  </g>

  <text x="564" y="218.5" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#00fff7">[ INSPECT &gt; ]</text>
</svg>
