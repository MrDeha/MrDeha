<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 245" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="topAccent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7"/>
      <stop offset="100%" stop-color="#ff2cdb" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse { animation: blink 2.2s infinite; }
  </style>

  <rect width="588" height="245" rx="6" fill="url(#cBg5)" stroke="#00fff7" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="1" y="1" width="586" height="3" rx="2" fill="url(#topAccent5)"/>

  <!-- Header Row -->
  <rect x="24" y="22" width="112" height="20" rx="3" fill="#ff2cdb" fill-opacity="0.08" stroke="#ff2cdb" stroke-opacity="0.3"/>
  <text x="80" y="35.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#ff2cdb" letter-spacing="1.5">ARCHIVE::05</text>

  <circle cx="446" cy="32" r="3.5" fill="#10b981" class="pulse"/>
  <text x="456" y="35.5" class="mono" font-size="9.5" font-weight="600" fill="#10b981" letter-spacing="1">PRODUCTION // LIVE</text>

  <!-- Title & Description -->
  <text x="24" y="70" class="sans" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">MindPalace</text>
  <text x="160" y="69" class="mono" font-size="10.5" fill="#00fff7">// Cognitive Knowledge Graph</text>

  <text x="24" y="95" class="sans" font-size="12.5" fill="#9ca3af">
    Personal digital mind palace and spatial second-brain system built to index,
  </text>
  <text x="24" y="113" class="sans" font-size="12.5" fill="#9ca3af">
    interconnect, and visualize architectural notes, mental models, and research.
  </text>

  <!-- Intelligence Report Box -->
  <rect x="24" y="128" width="540" height="62" rx="4" fill="#0d0f17" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="36" y="146" class="mono" font-size="9.5" font-weight="700" fill="#00fff7">[INTELLIGENCE REPORT: MINDPALACE]</text>
  <text x="36" y="163" class="mono" font-size="9.5" fill="#9ca3af">
    <tspan fill="#ff2cdb">&gt;</tspan> MEMORY GRAPH: Bi-directional node linking &amp; semantic tag clustering.
  </text>
  <text x="36" y="179" class="mono" font-size="9.5" fill="#9ca3af">
    <tspan fill="#ff2cdb">&gt;</tspan> INTERFACE: Zero-latency keyboard navigation &amp; dark cybernetic UI.
  </text>

  <!-- Tech Stack Pills -->
  <g class="mono" font-size="9.5" fill="#d1d5db">
    <rect x="24" y="204" width="84" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#00fff7" stroke-opacity="0.25"/>
    <text x="66" y="218.5" text-anchor="middle" fill="#00fff7">TypeScript</text>

    <rect x="116" y="204" width="62" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="147" y="218.5" text-anchor="middle">React</text>

    <rect x="186" y="204" width="98" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="235" y="218.5" text-anchor="middle">Knowledge UI</text>

    <rect x="292" y="204" width="66" height="22" rx="3" fill="#ffffff" fill-opacity="0.04" stroke="#ff2cdb" stroke-opacity="0.25"/>
    <text x="325" y="218.5" text-anchor="middle" fill="#ff2cdb">Vercel</text>
  </g>

  <text x="564" y="218.5" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#00fff7">[ LAUNCH &gt; ]</text>
</svg>
