<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFoot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0b0c12"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff7"/>
      <stop offset="100%" stop-color="#ff2cdb" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulseSignal { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .pulse { animation: pulseSignal 2s infinite; }
  </style>

  <rect width="1200" height="130" rx="8" fill="url(#bgFoot)" stroke="#1f242d" stroke-width="1.5"/>
  <rect x="100" y="1" width="1000" height="2" fill="url(#lineGrad)"/>

  <!-- Left Side: Handshake Terminal -->
  <circle cx="44" cy="46" r="4.5" fill="#00fff7" class="pulse"/>
  <text x="60" y="50" class="mono" font-size="11.5" font-weight="700" fill="#00fff7" letter-spacing="3.5">04 // ESTABLISH CONNECTION</text>
  <text x="40" y="80" class="sans" font-size="18" font-weight="700" fill="#ffffff">
    Ready to architect the next generation of intelligent systems?
  </text>
  <text x="40" y="104" class="mono" font-size="11" fill="#6b7280">
    <tspan fill="#ff2cdb">$</tspan> ssh uplink@dehaclk.com.tr --protocol=tls1.3 --port=deha.sys
  </text>

  <!-- Right Side: Direct Uplink Badges -->
  <rect x="760" y="34" width="206" height="62" rx="4" fill="#00fff7" fill-opacity="0.06" stroke="#00fff7" stroke-opacity="0.35"/>
  <text x="863" y="59" text-anchor="middle" class="mono" font-size="9.5" fill="#9ca3af" letter-spacing="2">SYSTEM INTERFACE</text>
  <text x="863" y="80" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00fff7" letter-spacing="1">dehaclk.com.tr ↗</text>

  <rect x="980" y="34" width="186" height="62" rx="4" fill="#ff2cdb" fill-opacity="0.06" stroke="#ff2cdb" stroke-opacity="0.35"/>
  <text x="1073" y="59" text-anchor="middle" class="mono" font-size="9.5" fill="#9ca3af" letter-spacing="2">TRANSMISSION</text>
  <text x="1073" y="80" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ff2cdb" letter-spacing="1">TLS 1.3 // ONLINE</text>
</svg>
