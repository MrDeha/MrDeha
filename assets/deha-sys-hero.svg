<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#08060c"/>
    </linearGradient>

    <!-- Cyan to Magenta Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff2cdb"/>
    </linearGradient>

    <!-- Subtle Cyan Card Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Laser Scanner Line Gradient -->
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2cdb" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00fff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#ff2cdb" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ff2cdb" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern (25px x 25px like deha.sys) -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00fff7" stroke-width="0.6" stroke-opacity="0.055"/>
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.018"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanSweep {
      0% { transform: translateY(65px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(395px); opacity: 0; }
    }
    @keyframes barLoad {
      0%, 100% { width: 228px; }
      50% { width: 240px; }
    }
    @keyframes logFade1 { 0%, 5% { opacity: 0; } 12%, 100% { opacity: 1; } }
    @keyframes logFade2 { 0%, 15% { opacity: 0; } 22%, 100% { opacity: 1; } }
    @keyframes logFade3 { 0%, 25% { opacity: 0; } 32%, 100% { opacity: 1; } }
    @keyframes logFade4 { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes logFade5 { 0%, 45% { opacity: 0; } 52%, 100% { opacity: 1; } }
    @keyframes logFade6 { 0%, 55% { opacity: 0; } 65%, 100% { opacity: 1; } }
    @keyframes logFade7 { 0%, 68% { opacity: 0; } 78%, 100% { opacity: 1; } }

    .pulse { animation: pulseDot 2s infinite ease-in-out; }
    .cursor { animation: cursorBlink 0.9s infinite; }
    .scanner { animation: scanSweep 5.5s infinite linear; }
    .log1 { animation: logFade1 8s infinite; }
    .log2 { animation: logFade2 8s infinite; }
    .log3 { animation: logFade3 8s infinite; }
    .log4 { animation: logFade4 8s infinite; }
    .log5 { animation: logFade5 8s infinite; }
    .log6 { animation: logFade6 8s infinite; }
    .log7 { animation: logFade7 8s infinite; }
  </style>

  <!-- Main Background -->
  <rect width="1200" height="440" rx="10" fill="url(#bgGrad)" stroke="#1f242d" stroke-width="1.5"/>
  <rect width="1200" height="440" rx="10" fill="url(#cyanGlow)"/>
  <rect width="1200" height="440" rx="10" fill="url(#magentaGlow)"/>
  <rect width="1200" height="440" rx="10" fill="url(#cyberGrid)"/>
  <rect width="1200" height="440" rx="10" fill="url(#scanlines)"/>

  <!-- Decorative Outer Corner HUD Brackets -->
  <!-- Top-Left Cyan Bracket -->
  <path d="M 14 42 L 14 14 L 42 14" fill="none" stroke="#00fff7" stroke-width="2.5" filter="url(#glowCyan)"/>
  <!-- Top-Right Cyan Bracket -->
  <path d="M 1158 14 L 1186 14 L 1186 42" fill="none" stroke="#00fff7" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Bottom-Left Magenta Bracket -->
  <path d="M 14 398 L 14 426 L 42 426" fill="none" stroke="#ff2cdb" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Bottom-Right Magenta Bracket -->
  <path d="M 1158 426 L 1186 426 L 1186 398" fill="none" stroke="#ff2cdb" stroke-width="2.5" filter="url(#glowMagenta)"/>

  <!-- ==================== TOP SYSTEM HEADER BAR ==================== -->
  <rect x="26" y="22" width="1148" height="40" rx="4" fill="#0d0e12" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Brand Logo Box -->
  <rect x="38" y="30" width="24" height="24" rx="4" fill="#00fff7" fill-opacity="0.12" stroke="#00fff7" stroke-opacity="0.5"/>
  <text x="50" y="46" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00fff7">D</text>

  <!-- Brand Title DEHA.SYS -->
  <text x="72" y="47" class="mono" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.5">DEHA<tspan fill="#ff2cdb">.</tspan>SYS</text>
  <text x="166" y="46" class="mono" font-size="10" fill="#6b7280" letter-spacing="2">// SYSTEM INTERFACE v2.6.0</text>

  <!-- Header Telemetry Indicators (Right Side) -->
  <!-- Core Pulse -->
  <rect x="690" y="30" width="145" height="24" rx="3" fill="#00fff7" fill-opacity="0.04" stroke="#00fff7" stroke-opacity="0.2"/>
  <text x="702" y="45" class="mono" font-size="9.5" fill="#00fff7" letter-spacing="1">CORE_PULSE:</text>
  <text x="782" y="45" class="mono" font-size="9.5" font-weight="700" fill="#e5e7eb">99.82%</text>

  <!-- Neural Latency -->
  <rect x="845" y="30" width="150" height="24" rx="3" fill="#ff2cdb" fill-opacity="0.04" stroke="#ff2cdb" stroke-opacity="0.2"/>
  <text x="857" y="45" class="mono" font-size="9.5" fill="#ff2cdb" letter-spacing="1">NEURAL_LAT:</text>
  <text x="935" y="45" class="mono" font-size="9.5" font-weight="700" fill="#e5e7eb">0.0042ms</text>

  <!-- Online Status -->
  <rect x="1005" y="30" width="155" height="24" rx="3" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.25"/>
  <circle cx="1019" cy="42" r="4" fill="#10b981" class="pulse"/>
  <text x="1031" y="45" class="mono" font-size="9.5" font-weight="700" fill="#10b981" letter-spacing="1.2">STATUS: ONLINE</text>

  <!-- ==================== LEFT COLUMN: HERO IDENTITY ==================== -->
  <!-- Connection Status Badge -->
  <rect x="44" y="88" width="232" height="25" rx="3" fill="#00fff7" fill-opacity="0.06" stroke="#00fff7" stroke-opacity="0.3"/>
  <circle cx="58" cy="100.5" r="3" fill="#00fff7" class="pulse"/>
  <text x="70" y="104" class="mono" font-size="9.5" font-weight="600" fill="#00fff7" letter-spacing="2.5">CONNECTION STATUS: STABLE</text>

  <!-- Main Heading: Hey, I'm Deha Çelik -->
  <text x="44" y="168" class="sans" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Hey, I'm <tspan fill="#ffffff">Deha Çelik</tspan>
  </text>

  <!-- Animated Gradient Underline under Deha Çelik -->
  <rect x="255" y="180" width="265" height="4" rx="2" fill="url(#neonGrad)" filter="url(#glowCyan)">
    <animate attributeName="width" values="0;265;265" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Role Prompt -->
  <text x="44" y="222" class="mono" font-size="19" font-weight="600" fill="#00fff7">&gt;</text>
  <text x="68" y="222" class="mono" font-size="18" font-weight="500" fill="#d1d5db" letter-spacing="0.5">
    Software Engineer <tspan fill="#4b5563">//</tspan> <tspan fill="#00fff7">AI Agent Architect</tspan> <tspan fill="#4b5563">//</tspan> System Builder
  </text>
  <rect x="658" y="205" width="10" height="21" fill="#ff2cdb" class="cursor"/>

  <!-- Architectural Philosophy Quote (Left Border) -->
  <line x1="46" y1="246" x2="46" y2="306" stroke="#00fff7" stroke-width="2" stroke-opacity="0.5"/>
  <text x="62" y="266" class="sans" font-size="13.5" fill="#9ca3af">
    "I don't just predict the future; I write the code that builds it.
  </text>
  <text x="62" y="286" class="sans" font-size="13.5" fill="#9ca3af">
    Bridging abstract imagination and digital reality through <tspan fill="#00fff7" font-weight="600">autonomous AI agents</tspan>,
  </text>
  <text x="62" y="306" class="sans" font-size="13.5" fill="#9ca3af">
    <tspan fill="#ffffff" font-weight="600">Rust/Tauri desktop systems</tspan>, and <tspan fill="#ff2cdb" font-weight="600">scalable full-stack web architectures</tspan>."
  </text>

  <!-- Bottom HUD Action / Telemetry Pills -->
  <!-- Button 1: [ ENTER SYSTEM // DEHACLK.COM.TR ] -->
  <rect x="44" y="336" width="236" height="38" rx="3" fill="#00fff7"/>
  <text x="162" y="359" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#060608" letter-spacing="1.8">[ PORT: DEHACLK.COM.TR ]</text>

  <!-- Button 2: SYSTEM_ENTITY_VERIFIED -->
  <rect x="294" y="336" width="224" height="38" rx="3" fill="#ffffff" fill-opacity="0.03" stroke="#00fff7" stroke-opacity="0.35"/>
  <text x="406" y="359" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#e5e7eb" letter-spacing="1.5">✓ SYSTEM_ENTITY_VERIFIED</text>

  <!-- Button 3: FOCUS -->
  <rect x="532" y="336" width="160" height="38" rx="3" fill="#ffffff" fill-opacity="0.02" stroke="#ff2cdb" stroke-opacity="0.35"/>
  <text x="612" y="359" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#ff2cdb" letter-spacing="1.5">AI // TAURI // WEB</text>

  <!-- ==================== RIGHT COLUMN: BOOT SEQUENCE TERMINAL ==================== -->
  <rect x="722" y="84" width="452" height="324" rx="6" fill="url(#panelGrad)" stroke="#00fff7" stroke-opacity="0.28"/>

  <!-- Terminal Window Header -->
  <rect x="722" y="84" width="452" height="32" rx="6" fill="#11131a" stroke="#00fff7" stroke-opacity="0.2"/>
  <circle cx="742" cy="100" r="4.5" fill="#ff2cdb" fill-opacity="0.8"/>
  <circle cx="758" cy="100" r="4.5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="774" cy="100" r="4.5" fill="#00fff7" fill-opacity="0.8"/>
  <text x="794" y="104" class="mono" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="1.5">SYSTEM_MONITOR // BOOT_SEQUENCE.SH</text>

  <!-- Animated Laser Scanner inside Terminal -->
  <rect x="724" y="0" width="448" height="2" fill="url(#scannerGrad)" class="scanner"/>

  <!-- Boot Sequence Logs (Directly inspired by BootSequence.tsx) -->
  <g class="mono" font-size="11.5">
    <text x="742" y="142" fill="#9ca3af" class="log1">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Initializing <tspan fill="#ffffff" font-weight="600">Deha Celik v2.6.0</tspan>...
    </text>
    <text x="742" y="168" fill="#9ca3af" class="log2">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Loading neural interface &amp; MCP servers...
    </text>
    <text x="742" y="194" fill="#9ca3af" class="log3">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Mounting <tspan fill="#00fff7">AgentBoard</tspan> [Tauri + Rust + React]
    </text>
    <text x="742" y="220" fill="#9ca3af" class="log4">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Spawning <tspan fill="#00fff7">deha-agent</tspan> autonomous runtime...
    </text>
    <text x="742" y="246" fill="#9ca3af" class="log5">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Calibrating visual core: <tspan fill="#00fff7">100% [==========]</tspan>
    </text>
    <text x="742" y="272" fill="#9ca3af" class="log6">
      <tspan fill="#ff2cdb" font-weight="700">$</tspan> Accessing secure TLS 1.3 handshake: <tspan fill="#10b981" font-weight="700">OK</tspan>
    </text>
    <text x="742" y="298" fill="#00fff7" font-weight="700" class="log7">
      <tspan fill="#ff2cdb">$</tspan> Access granted. Welcome to DEHA.SYS.
    </text>
  </g>

  <!-- Neural Core Progress Box inside Terminal Footer -->
  <rect x="742" y="322" width="412" height="68" rx="4" fill="#08090c" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="758" y="343" class="mono" font-size="9.5" fill="#9ca3af" letter-spacing="2">NEURAL_CORE // ACTIVE_ALLOCATION</text>
  <text x="1138" y="343" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#00fff7">SYNC: 99.8%</text>

  <!-- Progress Bar Track -->
  <rect x="758" y="354" width="380" height="6" rx="3" fill="#1f2937"/>
  <rect x="758" y="354" width="352" height="6" rx="3" fill="url(#neonGrad)">
    <animate attributeName="width" values="310;365;310" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Sub-metrics inside Terminal Footer -->
  <text x="758" y="378" class="mono" font-size="9" fill="#6b7280">NODES: <tspan fill="#d1d5db">23 REPOS</tspan></text>
  <text x="885" y="378" class="mono" font-size="9" fill="#6b7280">AGENTS: <tspan fill="#00fff7">AUTONOMOUS</tspan></text>
  <text x="1032" y="378" class="mono" font-size="9" fill="#6b7280">UPLINK: <tspan fill="#ff2cdb">ENCRYPTED</tspan></text>

  <!-- Bottom Coordinate Bar -->
  <text x="44" y="416" class="mono" font-size="9" fill="#4b5563" letter-spacing="2.5">SYS.LOC // TR_NODE_01  |  ARCH // FULL-STACK &amp; AI SYSTEMS  |  PROTOCOL // DEHA.SYS</text>
</svg>
